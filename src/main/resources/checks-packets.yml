# ANNA AC modular detector settings. Changes here are merged into the active runtime configuration.
checks:
  # Raw incoming position-packet sanity checks; supplemental signal, disabled until staging-tested.
  packet-sanity:
    # Enable extreme coordinate/step telemetry from PacketEvents. Not a complete movement simulator.
    enabled: false
    # Emit staff alerts when invalid coordinates or extreme single-packet steps repeat past cooldown.
    alert: true
    # Minimum time between repeated alerts for this player/check.
    alert-cooldown-ms: 5000
    # World names where this check should not run.
    ignored-worlds: []
    # Player permissions exempt from this check.
    ignored-permissions: []
    # Game modes exempt from this check (creative flight/server mechanics may differ).
    exempt-game-modes: [CREATIVE, SPECTATOR]
    # Reset the first-position baseline after this much time without a position packet; effective 250–10000ms.
    baseline-reset-gap-ms: 1500
    # Maximum allowed absolute X/Z coordinate before flagging a raw packet.
    max-absolute-coordinate: 30000000.0
    # Maximum allowed absolute Y coordinate before flagging a raw packet.
    max-absolute-y: 4096.0
    # Maximum horizontal displacement between sequential client position packets.
    # Kept very high to flag only extreme outliers; tune only with staging evidence.
    max-horizontal-step-per-packet: 16.0
    # Maximum vertical displacement between sequential client position packets.
    max-vertical-step-per-packet: 16.0
    # Server-version numeric overrides; version keys must use underscores such as '1_21_11'.
    version-overrides: {}
    # Client-protocol numeric overrides require compatible PacketEvents; they are not client-brand detection.
    client-version-overrides: {}
    # Violation level added for one invalid coordinate or extreme step.
    violation-add: 1.0
    # How quickly violation level decreases per second.
    violation-decay-per-second: 0.5
    # Violation level at which staff alerts are eligible.
    alert-vl: 2.0
    # Threshold for configured automatic action; action is disabled by default in punishments.yml.
    kick-vl: 10.0

  packet-rate:
    # Enable this feature. For experimental checks, leave false until tested on a staging server.
    enabled: false
    # Send alerts when this feature detects a possible violation.
    alert: true
    # Minimum milliseconds between repeated alerts for the same player/check.
    alert-cooldown-ms: 3000
    # World names where checks should not run. Empty means no worlds are ignored.
    ignored-worlds: []
    # Players with any listed permission are excluded from this check. Empty means none.
    ignored-permissions: []
    # Game modes excluded from this check, usually CREATIVE and SPECTATOR.
    exempt-game-modes: [CREATIVE, SPECTATOR]
    # Movement packet intervals below this may contribute to a packet-rate signal.
    minimum-interval-ms: 5
    # Number of recent packet intervals used in the rate estimate.
    sample-window: 40
    # Memory cap for each connected player's rolling movement-packet window (clamped to 128–4096).
    max-buffered-samples-per-player: 1024
    # Movement packet-rate threshold for this telemetry check.
    max-movement-packets-per-second: 45
    # Optional server/client-version overrides for packet-rate thresholds.
    version-overrides: {}
    client-version-overrides: {}
    # Minimum time between repeated flags from this check.
    flag-cooldown-ms: 3000
    # Violation level (VL) added when this check flags.
    violation-add: 1.0
    # How quickly this check's VL decreases over time.
    violation-decay-per-second: 0.5
    # VL at which alerts become eligible to be sent.
    alert-vl: 2.0
    # VL threshold for kicking, but only when the relevant punishment switches are enabled.
    kick-vl: 10.0

  # Packet-rate timing signal, not a validated simulation of client timer mechanics.

  timer:
    # Enable this feature. For experimental checks, leave false until tested on a staging server.
    enabled: false
    # Send alerts when this feature detects a possible violation.
    alert: true
    # Minimum milliseconds between repeated alerts for the same player/check.
    alert-cooldown-ms: 5000
    # World names where checks should not run. Empty means no worlds are ignored.
    ignored-worlds: []
    # Players with any listed permission are excluded from this check. Empty means none.
    ignored-permissions: []
    # Game modes excluded from this check, usually CREATIVE and SPECTATOR.
    exempt-game-modes: [CREATIVE, SPECTATOR]
    # Minimum elapsed time required before timer-rate telemetry is evaluated.
    minimum-sample-duration-ms: 1200
    # Movement packet-rate threshold for this telemetry check.
    max-movement-packets-per-second: 23
    # Optional server/client-version overrides for timer telemetry thresholds.
    version-overrides: {}
    client-version-overrides: {}
    # Minimum time between repeated flags from this check.
    flag-cooldown-ms: 5000
    # Violation level (VL) added when this check flags.
    violation-add: 1.0
    # How quickly this check's VL decreases over time.
    violation-decay-per-second: 0.5
    # VL at which alerts become eligible to be sent.
    alert-vl: 2.0
    # VL threshold for kicking, but only when the relevant punishment switches are enabled.
    kick-vl: 10.0

  # Conservative Mace damage anomaly signal. Disabled by default because plugins and enchantments
  # can alter damage. This is not a full vanilla damage simulator; validate against your server's mechanics.
