# Evidence storage and retention. Evidence is written asynchronously as JSONL.
database:
  # Relative path inside plugins/ANNA-AC. Absolute paths and paths escaping the plugin folder are rejected.
  evidence-directory: "evidence"
  # Remove evidence records older than this many days (0 removes all existing records at next cleanup).
  retention-days: 7
  # Maximum records retained per player evidence file.
  max-records-per-player: 5000
  # Maximum characters saved from a single detector detail string.
  max-detail-length: 1200
  # Keep in-memory violation levels across reconnects for this many idle hours.
  violation-retention-hours: 24
