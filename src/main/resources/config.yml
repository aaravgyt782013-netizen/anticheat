settings:
  prefix: "&8[&bANNA AC&8] &r"
  debug: false
  evidence-retention-days: 7
  max-evidence-records-per-player: 5000
  ignored-worlds: []

alerts:
  console: true
  staff-chat: true
  discord-webhook: ""
  discord-enabled: false

punishments:
  enabled: true
  kick-message: "&cUnfair advantage detected. If this is a mistake, contact staff."
  actions:
    movement:
      enabled: false
    movement-physics:
      enabled: false
    timer:
      enabled: false
    knockback:
      enabled: false
    reach:
      enabled: false
    click-rate:
      enabled: false
    combat-pattern:
      enabled: false
    scaffold-signal:
      enabled: false
    no-fall:
      enabled: false
    packet-rate:
      enabled: false

checks:
  movement:
    enabled: false
    alert: true
    alert-cooldown-ms: 3000
    ignored-worlds: []
    ignored-permissions: []
    exempt-game-modes: [CREATIVE, SPECTATOR]
    max-horizontal-distance-per-tick: 1.25
    violation-add: 1.0
    violation-decay-per-second: 0.25
    alert-vl: 3.0
    kick-vl: 12.0

  movement-physics:
    enabled: false
    alert: true
    alert-cooldown-ms: 3000
    ignored-worlds: []
    ignored-permissions: []
    exempt-game-modes: [CREATIVE, SPECTATOR]
    base-horizontal-per-tick: 0.72
    sprint-multiplier: 1.3
    ping-slack-per-ms: 0.001
    max-ping-slack: 0.75
    special-block-allowance-per-tick: 0.18
    max-sample-gap-ms: 250
    outlier-ratio: 2.2
    required-consecutive-outliers: 3
    violation-add: 1.0
    violation-decay-per-second: 0.5
    alert-vl: 3.0
    kick-vl: 12.0

  knockback:
    enabled: false
    alert: true
    alert-cooldown-ms: 4000
    ignored-worlds: []
    ignored-permissions: []
    exempt-game-modes: [CREATIVE, SPECTATOR]
    minimum-horizontal-velocity: 0.25
    observation-window-ms: 350
    ping-window-extension-per-ms: 0.5
    max-ping-window-extension-ms: 200
    minimum-observations: 4
    minimum-age-ms: 120
    minimum-observed-displacement: 0.08
    minimum-forward-projection: 0.04
    violation-add: 1.0
    violation-decay-per-second: 0.25
    alert-vl: 2.0
    kick-vl: 10.0

  reach:
    enabled: false
    alert: true
    alert-cooldown-ms: 3000
    ignored-worlds: []
    ignored-permissions: []
    exempt-game-modes: [CREATIVE, SPECTATOR]
    max-distance: 3.6
    ping-slack-per-ms: 0.001
    max-ping-slack: 0.20
    violation-add: 1.0
    violation-decay-per-second: 0.35
    alert-vl: 2.0
    kick-vl: 10.0

  click-rate:
    enabled: false
    alert: true
    alert-cooldown-ms: 3000
    ignored-worlds: []
    ignored-permissions: []
    exempt-game-modes: [CREATIVE, SPECTATOR]
    max-cps: 24
    flag-cooldown-ms: 1500
    violation-add: 1.0
    violation-decay-per-second: 0.5
    alert-vl: 2.0
    kick-vl: 10.0

  combat-pattern:
    enabled: false
    alert: true
    alert-cooldown-ms: 5000
    ignored-worlds: []
    ignored-permissions: []
    exempt-game-modes: [CREATIVE, SPECTATOR]
    rotation-quantization-degrees: 0.15
    maximum-hit-angle-degrees: 22.0
    rotation-window-ms: 180
    ping-angle-allowance-per-ms: 0.02
    max-ping-angle-allowance: 8.0
    hit-angle-violation-add: 0.5
    rotation-violation-add: 0.5
    pattern-window-ms: 5000
    minimum-hits: 12
    minimum-repeated-rotations: 7
    violation-add: 0.5
    violation-decay-per-second: 0.2
    alert-vl: 1.0
    kick-vl: 8.0

  scaffold-signal:
    enabled: false
    alert: true
    alert-cooldown-ms: 3000
    ignored-worlds: []
    ignored-permissions: []
    exempt-game-modes: [CREATIVE, SPECTATOR]
    minimum-downward-pitch: 65.0
    min-horizontal-distance: 0.8
    minimum-horizontal-speed: 0.10
    pattern-window-ms: 1500
    maximum-pitch-variance: 2.0
    minimum-consecutive-placements: 8
    violation-add: 0.25
    violation-decay-per-second: 0.5
    alert-vl: 2.0
    kick-vl: 10.0

  no-fall:
    enabled: false
    alert: true
    alert-cooldown-ms: 4000
    ignored-worlds: []
    ignored-permissions: []
    exempt-game-modes: [CREATIVE, SPECTATOR]
    minimum-fall-distance: 4.0
    landing-observation-window-ms: 1500
    landing-delay-ticks: 2
    violation-add: 1.0
    violation-decay-per-second: 0.25
    alert-vl: 2.0
    kick-vl: 10.0

  packet-rate:
    enabled: false
    alert: true
    alert-cooldown-ms: 3000
    ignored-worlds: []
    ignored-permissions: []
    exempt-game-modes: [CREATIVE, SPECTATOR]
    minimum-interval-ms: 5
    sample-window: 40
    max-movement-packets-per-second: 45
    flag-cooldown-ms: 3000
    violation-add: 1.0
    violation-decay-per-second: 0.5
    alert-vl: 2.0
    kick-vl: 10.0

  timer:
    enabled: false
    alert: true
    alert-cooldown-ms: 5000
    ignored-worlds: []
    ignored-permissions: []
    exempt-game-modes: [CREATIVE, SPECTATOR]
    minimum-sample-duration-ms: 1200
    max-movement-packets-per-second: 23
    flag-cooldown-ms: 5000
    violation-add: 1.0
    violation-decay-per-second: 0.5
    alert-vl: 2.0
    kick-vl: 10.0

  force-op:
    enabled: true
    alert: true
    cancel-player-op-commands: true
    kick-player-on-attempt: false
    detect-op-grants: true
    persist-operator-baseline: true
    audit-console-op-commands: true
    protected-command-prefixes: [op, deop, minecraft:op, minecraft:deop, bukkit:op, bukkit:deop, lp, luckperms, lpv, pex, permissions, manuadd]
