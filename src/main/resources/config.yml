# General plugin settings.
settings:
  # Text shown before ANNA AC messages. Supports Minecraft & color codes.
  prefix: "&8[&bANNA AC&8] &r"
  # Language for plugin messages: en = English, hi = Hindi.
  language: "en" # Supported: en, hi
  # Print extra diagnostic information to the server console. Keep false normally.
  debug: false
  # World names where checks should not run. Empty means no worlds are ignored.
  ignored-worlds: []
  # Reduce false positives when the server is overloaded. Applies to gameplay detector checks only.
  performance:
    # Enable a lag guard for only the checks listed below; never pause every detector implicitly.
    # Packet-rate, timer, and click-rate stay active by default because packet telemetry can remain useful during tick lag.
    pause-detection-under-tps-enabled: true
    # Detectors whose event/tick-based evidence is unreliable under low server TPS.
    # Add/remove names to customize the policy. Use ['*'] only if you deliberately want every detector paused.
    pause-checks-on-low-tps:
      - movement
      - movement-physics
      - flight
      - jesus
      - spider-signal
      - knockback
      - reach
      - wall-hit
      - block-reach
      - mace-damage
      - fast-break
      - nuker-burst
      - container-steal
      - scaffold-signal
      - no-fall
      - combat-pattern
    # Valid range: 1.0–20.0. The guard uses Paper's one-minute TPS sample.
    minimum-tps: 17.0
