# Automatic punishment settings. Start with actions disabled until staging validation is complete.
punishments:
  # Master switch for all automatic punishment actions configured below.
  enabled: true
  # Message shown to a player when a configured check kicks them.
  kick-message: "&cUnfair advantage detected. If this is a mistake, contact staff."
  # Require evidence from independent detector families before an automatic kick; safer for public servers.
  require-independent-families: true
  # Number of independent families required when require-independent-families is true (1–4).
  minimum-independent-families: 2
  # Minimum distinct flags required within each family in the correlation window (1–20).
  minimum-signals-per-family: 2
  # Time window in milliseconds used to correlate distinct detector families (effective range 1000–120000).
  correlation-window-ms: 12000
  # Maximum recent signals retained per player for correlation, protecting memory use.
  max-correlation-signals-per-player: 100
  # Per-check punishment switches. Each check must be enabled here as well as in its detector settings.
  actions:
    # Basic horizontal movement-distance heuristic. Not a complete Minecraft physics simulator.
    movement:
      # Enable automatic punishment for this check. Keep false until staging validation is complete.
      enabled: false
      # Action: KICK, WARN, COMMAND or NONE. The action runs only when enabled is true.
      type: "KICK"
      # Required violation level for this action; independently configurable per check.
      threshold-vl: 12.0
      # Minimum milliseconds between repeated actions for this player/check.
      cooldown-ms: 30000
      # Optional message for KICK/WARN; empty uses the global kick message or built-in warning.
      message: ""
      # Commands run as console only for type COMMAND. Use %player%, %uuid%, %check%, and %vl%.
      # Keep this list empty unless you intentionally want console commands executed by ANNA AC.
      commands: []
    # Experimental movement-envelope heuristic; may flag legitimate movement and is disabled by default.
    movement-physics:
      # Enable automatic punishment for this check. Keep false until staging validation is complete.
      enabled: false
      # Action: KICK, WARN, COMMAND or NONE. The action runs only when enabled is true.
      type: "KICK"
      # Required violation level for this action; independently configurable per check.
      threshold-vl: 12.0
      # Minimum milliseconds between repeated actions for this player/check.
      cooldown-ms: 30000
      # Optional message for KICK/WARN; empty uses the global kick message or built-in warning.
      message: ""
      # Commands run as console only for type COMMAND. Use %player%, %uuid%, %check%, and %vl%.
      # Keep this list empty unless you intentionally want console commands executed by ANNA AC.
      commands: []
    # Packet-rate timing signal, not a validated simulation of client timer mechanics.
    timer:
      # Enable automatic punishment for this check. Keep false until staging validation is complete.
      enabled: false
      # Action: KICK, WARN, COMMAND or NONE. The action runs only when enabled is true.
      type: "KICK"
      # Required violation level for this action; independently configurable per check.
      threshold-vl: 10.0
      # Minimum milliseconds between repeated actions for this player/check.
      cooldown-ms: 30000
      # Optional message for KICK/WARN; empty uses the global kick message or built-in warning.
      message: ""
      # Commands run as console only for type COMMAND. Use %player%, %uuid%, %check%, and %vl%.
      # Keep this list empty unless you intentionally want console commands executed by ANNA AC.
      commands: []
    # Experimental check for movement after server-applied velocity.
    knockback:
      # Enable automatic punishment for this check. Keep false until staging validation is complete.
      enabled: false
      # Action: KICK, WARN, COMMAND or NONE. The action runs only when enabled is true.
      type: "KICK"
      # Required violation level for this action; independently configurable per check.
      threshold-vl: 10.0
      # Minimum milliseconds between repeated actions for this player/check.
