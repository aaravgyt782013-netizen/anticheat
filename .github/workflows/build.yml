name: Build ANNA AC
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper_api_version:
          - '1.21-R0.1-SNAPSHOT'
          - '1.21.11-R0.1-SNAPSHOT'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Test and build
        run: gradle -PpaperApiVersion='${{ matrix.paper_api_version }}' clean test build
      - uses: actions/upload-artifact@v4
        with:
          name: anna-ac-jar-paper-${{ matrix.paper_api_version }}
          path: build/libs/*.jar
